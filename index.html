<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OWNER Mobile Action Panel — B001 CTA反映</title>
<style>
  :root{
    --ink:#1B211E; --ink-soft:#5A625D; --paper:#F4F5F2; --card:#FFFFFF;
    --line:#DDE2DA; --accent:#2F3F63; --accent-soft:#E3E8F1;
    --ok:#2F7A46; --ok-soft:#E1F0E5;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    font-size:16px; line-height:1.6; padding-bottom:3rem;
  }
  header{
    position:sticky; top:0; z-index:10; background:var(--paper);
    padding:1rem 1rem 0.8rem; border-bottom:1px solid var(--line);
  }
  h1{ font-size:1.05rem; margin:0 0 0.15rem; }
  .sub{ font-size:0.8rem; color:var(--ink-soft); margin:0 0 0.7rem; }
  .progress-row{ display:flex; align-items:center; gap:0.7rem; }
  .progress-label{ font-weight:700; font-size:0.95rem; white-space:nowrap; }
  .progress-track{ flex:1; height:8px; background:var(--line); border-radius:999px; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--ok); border-radius:999px; transition:width 0.2s ease; }
  main{ padding:1rem; max-width:520px; margin:0 auto; }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:1rem; margin-bottom:1rem; box-shadow:0 1px 2px rgba(0,0,0,0.04);
  }
  .card.done{ border-color:var(--ok); background:var(--ok-soft); }
  .card-title{ font-weight:700; font-size:0.98rem; margin:0 0 0.6rem; }
  .cta-text{
    font-size:0.9rem; color:var(--ink); background:var(--accent-soft);
    border-radius:8px; padding:0.7rem 0.8rem; margin:0 0 0.7rem; white-space:pre-wrap;
  }
  .btn-row{ display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:0.7rem; }
  button{
    font-size:0.88rem; font-weight:600; padding:0.65rem 0.9rem; border-radius:8px;
    border:1px solid var(--accent); background:var(--accent); color:#fff;
    cursor:pointer; min-height:44px; flex:1;
  }
  button.secondary{ background:#fff; color:var(--accent); }
  button:disabled{ background:var(--line); border-color:var(--line); color:var(--ink-soft); cursor:not-allowed; }
  .copy-feedback{ font-size:0.82rem; color:var(--ok); min-height:1.2em; margin:-0.3rem 0 0.5rem; }
  .url-missing{ font-size:0.78rem; color:var(--ink-soft); margin:-0.3rem 0 0.5rem; }
  .check-row{ display:flex; align-items:center; gap:0.5rem; font-size:0.9rem; }
  .check-row input{ width:1.2rem; height:1.2rem; }
  footer{ max-width:520px; margin:1.5rem auto 0; padding:0 1rem; }
  #reset-btn{ background:#fff; color:#9C3B3B; border-color:#9C3B3B; width:100%; }
</style>
</head>
<body>

<header>
  <h1>OWNER Mobile Action Panel</h1>
  <p class="sub">B001「定時の人」— 無料記事へのCTA反映</p>
  <div class="progress-row">
    <span class="progress-label" data-testid="progress">CTA反映 0 / 7</span>
    <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  </div>
</header>

<main id="card-list"></main>

<footer>
  <button id="reset-btn" data-testid="reset-btn">すべて未完了に戻す</button>
</footer>

<script>
// ── データ（ここを編集すればCTA・URLを差し替えられる） ──────────────
// note_url が空文字の記事は「note URL未登録」と表示され、コピー機能のみ使用可能。
const ARTICLES = [
  {
    id: "free-01",
    title: "AIでファイル整理を一瞬で終わらせる方法",
    noteUrl: "https://note.com/teijinohito/n/nbd57098a7550",
    cta: "ファイルの整理だけでなく、メールや会議の準備、資料作成もAIに任せられます。実務でそのまま使えるテンプレートを50個まとめた「定時で帰るためのAI仕事術50」も公開しています。"
  },
  {
    id: "free-02",
    title: "AIでメール返信の時間を半分にする方法",
    noteUrl: "https://note.com/teijinohito/n/n1cb8a6f9e2b7",
    cta: "メール返信の時短は、会議準備や資料作成にもそのまま応用できます。同じ考え方をテンプレート化した「定時で帰るためのAI仕事術50」もあわせてどうぞ。"
  },
  {
    id: "free-03",
    title: "準備・進行・議事録をAIで効率化",
    noteUrl: "https://note.com/teijinohito/n/nbc92efa8c551",
    cta: "今日紹介した準備・進行・議事録の効率化は、日々の業務のごく一部です。メール対応や資料作成まで含めた50パターンを「定時で帰るためのAI仕事術50」としてまとめています。"
  },
  {
    id: "free-04",
    title: "皆さんは、1日が30分増えたら何をしますか？",
    noteUrl: "https://note.com/teijinohito/n/n28cb18413267",
    cta: "「30分増えたら」を想像で終わらせず、実際に生み出す具体策をまとめたのが「定時で帰るためのAI仕事術50」です。今日から使えるテンプレート50個で試せます。"
  },
  {
    id: "free-05",
    title: "仕事が早い人が毎日やっているたった3つのこと",
    noteUrl: "https://note.com/teijinohito/n/n96dc852d2431",
    cta: "3つの習慣の先にある、具体的なやり方をテンプレート化したのが「定時で帰るためのAI仕事術50」です。今日から真似できる形にまとめています。"
  },
  {
    id: "free-06",
    title: "毎日30分早く帰りたい人のために",
    noteUrl: "https://note.com/teijinohito/n/n2b44d9e75efa",
    cta: "「毎日30分早く帰りたい」を叶える具体的なテンプレートを50個まとめたのが「定時で帰るためのAI仕事術50」です。"
  },
  {
    id: "free-07",
    title: "【自己紹介】毎日30分、仕事を…",
    noteUrl: "https://note.com/teijinohito/n/nc1663af52346",
    cta: "実際にどんなテンプレートを使っているかをまとめたのが「定時で帰るためのAI仕事術50」です。仕事を早く終わらせたい方はぜひご覧ください。"
  }
];

const STORAGE_KEY = "owner_action_panel_b001_cta_v1";

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}

function saveState(state) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

async function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (e) {
      // フォールバックへ続行
    }
  }
  // フォールバック: 非表示textarea + execCommand（クリップボードAPIが使えない環境向け）
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (e) {
    return false;
  }
}

function render() {
  const state = loadState();
  const list = document.getElementById("card-list");
  list.innerHTML = "";

  ARTICLES.forEach(function (article) {
    const done = !!state[article.id];

    const card = document.createElement("div");
    card.className = "card" + (done ? " done" : "");
    card.setAttribute("data-testid", "card-" + article.id);

    const title = document.createElement("p");
    title.className = "card-title";
    title.textContent = article.title;
    card.appendChild(title);

    const ctaText = document.createElement("div");
    ctaText.className = "cta-text";
    ctaText.textContent = article.cta;
    card.appendChild(ctaText);

    const btnRow = document.createElement("div");
    btnRow.className = "btn-row";

    const copyBtn = document.createElement("button");
    copyBtn.textContent = "CTAをコピー";
    copyBtn.setAttribute("data-testid", "copy-btn-" + article.id);
    btnRow.appendChild(copyBtn);

    const openBtn = document.createElement("button");
    openBtn.className = "secondary";
    openBtn.setAttribute("data-testid", "open-btn-" + article.id);
    if (article.noteUrl) {
      openBtn.textContent = "note記事を開く";
      openBtn.addEventListener("click", function () {
        window.open(article.noteUrl, "_blank", "noopener");
      });
    } else {
      openBtn.textContent = "note記事を開く";
      openBtn.disabled = true;
    }
    btnRow.appendChild(openBtn);
    card.appendChild(btnRow);

    if (!article.noteUrl) {
      const missing = document.createElement("p");
      missing.className = "url-missing";
      missing.textContent = "note URL未登録（コピー機能のみ利用できます）";
      missing.setAttribute("data-testid", "url-missing-" + article.id);
      card.appendChild(missing);
    }

    const feedback = document.createElement("p");
    feedback.className = "copy-feedback";
    feedback.setAttribute("data-testid", "copy-feedback-" + article.id);
    card.appendChild(feedback);

    copyBtn.addEventListener("click", function () {
      copyText(article.cta).then(function (ok) {
        feedback.textContent = ok ? "コピーしました" : "コピーできませんでした。CTA本文を長押しして手動でコピーしてください";
        if (ok) {
          setTimeout(function () {
            feedback.textContent = "";
          }, 3000);
        }
      });
    });

    const checkRow = document.createElement("label");
    checkRow.className = "check-row";
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = done;
    checkbox.setAttribute("data-testid", "check-" + article.id);
    checkbox.addEventListener("change", function () {
      const s = loadState();
      s[article.id] = checkbox.checked;
      saveState(s);
      render();
    });
    checkRow.appendChild(checkbox);
    const checkLabel = document.createElement("span");
    checkLabel.textContent = "反映済み";
    checkRow.appendChild(checkLabel);
    card.appendChild(checkRow);

    list.appendChild(card);
  });

  const doneCount = ARTICLES.filter(function (a) { return !!state[a.id]; }).length;
  document.querySelector('[data-testid="progress"]').textContent =
    "CTA反映 " + doneCount + " / " + ARTICLES.length;
  document.getElementById("progress-fill").style.width =
    (ARTICLES.length ? (doneCount / ARTICLES.length * 100) : 0) + "%";
}

document.getElementById("reset-btn").addEventListener("click", function () {
  if (window.confirm("すべての「反映済み」チェックを解除します。よろしいですか？")) {
    saveState({});
    render();
  }
});

render();
</script>
</body>
</html>
